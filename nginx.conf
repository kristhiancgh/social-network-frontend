# =============================================================================
#  nginx configuration for the production image.
#
#  Two jobs:
#    1. Serve the compiled Angular bundle.
#    2. Be the same-origin proxy that proxy.conf.json is during development,
#       so every API path in the app can stay relative and the image is not
#       tied to the hostname it was built for.
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip on text; images and the .js/.css hashes are already compressed or
    # cached forever, so this is where it actually pays.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # -------------------------------------------------------------------------
    #  REST API -> gateway
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api-gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # auth-service reads this to record where a login attempt came from.
        # Without it every attempt in the audit log would show nginx's own
        # container address.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    #  WebSockets -> gateway -> like-service (/ws) and post-service (/ws-posts)
    # -------------------------------------------------------------------------
    #  Note nginx matches the LONGEST prefix, so `location /ws` would also catch
    #  /ws-posts if this block did not exist. Both are declared explicitly.
    location /ws-posts {
        proxy_pass         http://api-gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /ws {
        proxy_pass         http://api-gateway:8080;

        # These four lines ARE the WebSocket support. HTTP/1.1 plus the Upgrade
        # and Connection headers are what turn the request into a protocol
        # switch; drop any of them and nginx quietly proxies it as an ordinary
        # request, the handshake never completes, and the like counter stops
        # updating with no error anywhere.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;

        # A STOMP connection is idle between messages by design. The default
        # 60s would drop it during any quiet moment; the client's 10s
        # heartbeats keep it alive well inside this window.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # -------------------------------------------------------------------------
    #  Static assets
    # -------------------------------------------------------------------------
    # Hashed filenames, so they can be cached indefinitely - a new build
    # produces new names rather than needing the old ones invalidated.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # -------------------------------------------------------------------------
    #  Angular routing
    # -------------------------------------------------------------------------
    # Client-side routes have no file behind them, so /profile must return
    # index.html rather than 404. index.html itself is never cached, otherwise
    # a browser would keep loading a stale page that references deleted bundles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Used by the container healthcheck.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
